# Publishes the app to GitHub Pages (free for public repositories) on every push.
# Only the app files are published: the PRD, docs and the .agents kit stay in the repo only.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: for f in assets/*.js sw.js server.mjs; do node --check "$f"; done

      - name: Collect the app files
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
